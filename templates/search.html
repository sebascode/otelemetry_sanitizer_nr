<!-- templates/search.html -->
<!DOCTYPE html>
<html>
<head>
    <title>DEMO - Support Log Search</title>
    <style>
        body { font-family: Arial; max-width: 1200px; margin: 50px auto; }
        .search-box { margin: 20px 0; }
        input { padding: 10px; width: 300px; }
        button { padding: 10px 20px; background: #0066cc; color: white; border: none; cursor: pointer; }
        .results { margin-top: 30px; }
        .log-entry { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
    </style>
</head>
<body>
    <h1>Support Log Search</h1>
    
    <div class="search-box">
        <select id="searchType">
            <option value="rut">RUT</option>
            <option value="email">Email</option>
            <option value="phone">Phone</option>
            <option value="license">License</option>
        </select>
        <input type="text" id="searchValue" placeholder="Enter value (e.g., 12.345.678-9)">
        <button onclick="search()">Search</button>
    </div>
    
    <div id="results" class="results"></div>
    
    <script>
        async function search() {
            const value = document.getElementById('searchValue').value;
            const type = document.getElementById('searchType').value;
            
            const response = await fetch('/search', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({value, type})
            });
            
            const data = await response.json();
            
            document.getElementById('results').innerHTML = `
                <h3>Search Results</h3>
                <p><strong>Original Value:</strong> ${data.search_value}</p>
                <p><strong>Token:</strong> <code>${data.token}</code></p>
                <p><strong>Logs Found:</strong> ${data.logs_found}</p>
                <div class="logs">
                    ${JSON.stringify(data.logs, null, 2)}
                </div>
            `;
        }
    </script>
</body>
</html>
